# Production overrides — استخدام:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# هذا الملفّ يُلغي إعدادات التطوير في docker-compose.yml ويستبدلها بإعدادات
# الإنتاج (frontend في حاوية، nginx يصل إليه عبر docker network، إلخ).

services:
  db:
    # في الإنتاج لا نُعرّض المنفذ إلى الـ host (مخاطرة أمنيّة)
    ports: !reset []

  redis:
    # نفس الشيء — Redis داخلي فقط
    ports: !reset []

  backend:
    # في الإنتاج: نستخدم Dockerfile CMD (gunicorn) — لا runserver
    command: !reset null
    # نُلغي تجاوزات التطوير لـ external system (نريد قيم .env تسود)
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    # لا حاجة لـ extra_hosts (لا نصل لـ host في الإنتاج)
    extra_hosts: !reset []
    # لا نُركّب الكود من الـ host في الإنتاج (الـ image يحوي ما يلزم)
    volumes: !reset []
    restart: unless-stopped

  frontend:
    # في الإنتاج: نبني ثمّ نُشغّل في وضع الإنتاج (npm start)
    command: sh -c "npm run build && npm start"
    # لا نُركّب الكود — نستخدم ما بُني داخل الـ image
    volumes: !reset []
    # نتأكّد أنّ Next.js يستمع على 0.0.0.0 لا 127.0.0.1
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://anjaz.inss.local/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://anjaz.inss.local/ws}
      - HOSTNAME=0.0.0.0
    restart: unless-stopped

  nginx:
    # في الإنتاج: نستخدم config مختلف (frontend في حاوية، ليس على host)
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    # لا حاجة لـ extra_hosts في الإنتاج
    extra_hosts: !reset []
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
