services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-anjaz_db}
      POSTGRES_USER: ${DB_USER:-anjaz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your-db-password}
    ports:
      - "5432:5432"
    # postgres 18+ يتوقّع الـ mount على مستوى /var/lib/postgresql (وليس /data)
    # ليُدير subdirectories خاصّة بالنسخة الكبرى (لدعم pg_upgrade --link).
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anjaz_user} -d ${DB_NAME:-anjaz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # ملاحظة: لا نُعرّض المنفذ إلى الـ host لتجنّب التعارض مع أي Redis محلي.
    # الـ backend يصل عبر docker network (hostname: redis).
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        BUILD_ENV: development
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    # داخل docker، يجب أن يشير الـ backend إلى docker service "db" / "redis"،
    # وليس إلى localhost الذي يعني الـ backend container نفسه. والـ API الخارجي
    # موجود على الـ host (Windows)، نصل إليه عبر host.docker.internal.
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      EXTERNAL_ORG_API_URL: http://host.docker.internal:8001/api/external/
      EXTERNAL_ORG_HOST_HEADER: localhost:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # شهادات HTTPS — mount للقراءة فقط
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    # نسمح بالوصول إلى الـ frontend الذي يعمل على الـ host (npm run dev)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
