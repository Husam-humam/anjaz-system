upstream backend {
    server backend:8000;
}

# في التطوير: الـ frontend يعمل محلياً على الـ host (npm run dev)
# في الإنتاج: غيّر إلى `server frontend:3000;` بعد تشغيل حاوية frontend
upstream frontend {
    server host.docker.internal:3000;
}

# ────────────────────────────────────────────────────
# Redirect HTTP → HTTPS
# ────────────────────────────────────────────────────
server {
    listen 80;
    server_name anjaz.inss.local inss.local localhost;
    return 301 https://$host$request_uri;
}

# ────────────────────────────────────────────────────
# HTTPS — main server
# ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name anjaz.inss.local inss.local localhost;

    # شهادة wildcard لـ *.inss.local صادرة من Win-CA الخاصّ
    ssl_certificate     /etc/nginx/ssl/wd.cer;
    ssl_certificate_key /etc/nginx/ssl/aw.key;

    # إعدادات TLS حديثة (TLS 1.2 + 1.3 فقط، ciphers قويّة)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js HMR (تطوير فقط) — webpack/turbopack يُرسل WebSocket لتحديث الـ UI
    # تلقائياً عند تعديل الكود. نُمرّره بـ WebSocket upgrade headers.
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
